name: 生成多仓JSON

on:
  schedule:
    - cron: '30 18 * * *'   # 每天北京时间 02:30 运行
  workflow_dispatch:         # 允许手动运行
  push:
    paths:
      - 'list.txt'
      - 'tvbox/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成多仓JSON
        run: python python/generate_duocang.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add duocang.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自动更新多仓JSON" && git push)
